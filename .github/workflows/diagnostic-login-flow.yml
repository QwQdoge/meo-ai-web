name: Diagnostic live login flow

on:
  push:
    branches:
      - diagnostic/login-flow-20261017

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe chat.meoarch.org routes
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            local expected="$2"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            echo "$url -> $status"
            sed -n '1,12p' "$headers" | sed -E 's/(set-cookie:).*/\1 [redacted]/I'
            if [[ "$status" != "$expected" ]]; then
              echo "Unexpected status: expected $expected, got $status"
              head -c 500 "$body" || true
              echo
              exit 1
            fi
          }

          probe 'https://chat.meoarch.org/' 200
          probe 'https://chat.meoarch.org/new' 200
          probe 'https://chat.meoarch.org/api/session' 401
          probe 'https://chat.meoarch.org/oauth/openid/callback' 400

      - name: Verify login redirect and exact OAuth callback
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' 'https://chat.meoarch.org/oauth/openid?return=%2Fnew')"
          echo "login start -> $status"
          test "$status" = 302
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          test -n "$location"
          python - "$location" <<'PY'
          import sys
          from urllib.parse import urlparse, parse_qs
          url = sys.argv[1]
          p = urlparse(url)
          q = parse_qs(p.query)
          print('authorize host:', p.netloc)
          print('authorize path:', p.path)
          print('redirect_uri:', q.get('redirect_uri', [''])[0])
          assert p.scheme == 'https'
          assert p.netloc == 'account.meoarch.org'
          assert p.path == '/v1/auth/oauth2/authorize'
          assert q.get('redirect_uri') == ['https://chat.meoarch.org/oauth/openid/callback']
          assert q.get('client_id') == ['8f2e0255-187d-448f-9e25-bc275d1b6015']
          assert q.get('response_type') == ['code']
          assert q.get('code_challenge')
          assert q.get('state')
          PY

      - name: Compare current cutover preview callback routing
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://cutover-react-web-pages.meo-ai-web.pages.dev/new' \
            'https://cutover-react-web-pages.meo-ai-web.pages.dev/oauth/openid/callback'; do
            status="$(curl -sS --max-time 20 -o /tmp/body -w '%{http_code}' "$url")"
            echo "$url -> $status"
            if [[ "$url" == */new ]]; then test "$status" = 200; else test "$status" = 400; fi
          done
