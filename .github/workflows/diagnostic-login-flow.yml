name: Diagnostic live login flow

on:
  push:
    branches:
      - diagnostic/login-flow-20261017

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe all live routes without early exit
        shell: bash
        run: |
          set -u
          probe() {
            local url="$1"
            local headers body status location
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            echo "URL=$url STATUS=$status LOCATION=${location:-none}"
            if [[ -s "$body" ]]; then
              printf 'BODY_PREFIX='
              head -c 240 "$body" | tr '\n' ' '
              echo
            fi
          }

          probe 'https://chat.meoarch.org/'
          probe 'https://chat.meoarch.org/new'
          probe 'https://chat.meoarch.org/new?project=test'
          probe 'https://chat.meoarch.org/api/session'
          probe 'https://chat.meoarch.org/oauth/openid/callback'
          probe 'https://chat.meoarch.org/oauth/openid/callback?code=fake&state=fake'
          probe 'https://chat.meoarch.org/oauth/openid?return=%2Fnew'
          probe 'https://cutover-react-web-pages.meo-ai-web.pages.dev/'
          probe 'https://cutover-react-web-pages.meo-ai-web.pages.dev/new'
          probe 'https://cutover-react-web-pages.meo-ai-web.pages.dev/oauth/openid/callback'

      - name: Verify production login redirect contract
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' 'https://chat.meoarch.org/oauth/openid?return=%2Fnew')"
          echo "login start -> $status"
          test "$status" = 302
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          python - "$location" <<'PY'
          import sys
          from urllib.parse import urlparse, parse_qs
          p = urlparse(sys.argv[1]); q = parse_qs(p.query)
          print('authorize host:', p.netloc)
          print('authorize path:', p.path)
          print('redirect_uri:', q.get('redirect_uri', [''])[0])
          assert p.netloc == 'account.meoarch.org'
          assert p.path == '/v1/auth/oauth2/authorize'
          assert q.get('redirect_uri') == ['https://chat.meoarch.org/oauth/openid/callback']
          assert q.get('client_id') == ['8f2e0255-187d-448f-9e25-bc275d1b6015']
          assert q.get('response_type') == ['code']
          assert q.get('code_challenge') and q.get('state')
          PY

      - name: Assert callback function exists in production
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 20 -o /tmp/body -w '%{http_code}' 'https://chat.meoarch.org/oauth/openid/callback')"
          echo "callback without params -> $status"
          test "$status" = 400
          grep -q 'missing_code' /tmp/body
